# SWAG proxy config for the Strixhaven Companion -> https://dnd.gulu.stream
# Copy to /mnt/user/appdata/swag/nginx/proxy-confs/ and restart SWAG.
# Same style as watch.subdomain.conf. SWAG runs with host networking, so it reaches
# the app on the server's LAN IP and the companion's host port (8765).
server {
    listen 443 ssl;
    server_name dnd.gulu.stream;

    # The D&D Beyond party sync posts ~3 MB of character data (nginx default is 1 MB).
    client_max_body_size 50m;

    location / {
        proxy_pass http://192.168.1.230:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;

        # AI answers stream word by word: don't buffer them, and allow slow "Careful" answers.
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
